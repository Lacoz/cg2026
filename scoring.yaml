# Local evaluation gates — run: ./cg test
# Wood 1+: API opponent "default" (no boss in Wood — boss needs higher league)

challenge: fall-challenge-2026
bot: bot.py
language: Python3

opponents:
  - id: default
    games: 5
    gates:
      min_win_rate: 0.2
      min_median_score: 3
      max_crash_rate: 0.5

  # Uncomment when your CodinGame league has a boss (typically Bronze+):
  # - id: boss
  #   games: 5
  #   gates:
  #     min_win_rate: 0.35
  #     min_median_score: 15
  #     max_crash_rate: 0.2

metrics:
  track:
    - win
    - my_score
    - opp_score
    - spawns
    - captures
    - move_errors
    - timeout
    - eliminated

results_dir: results
